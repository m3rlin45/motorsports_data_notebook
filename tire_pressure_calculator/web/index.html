<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Inferno Tire Pressure Calculator</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tire Pressure" />
  <meta name="theme-color" content="#1f1f1f" />
  <meta name="color-scheme" content="dark" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app">
    <!-- Top bar: mode toggle + language picker -->
    <header class="topbar">
      <div class="mode-group">
        <span id="modeLabel" class="mode-label"></span>
        <button id="modeToggle" class="toggle" role="switch" aria-checked="false" type="button">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span id="modeContent" class="toggle-content"></span>
        </button>
        <span id="modelUnavailable" class="model-unavailable" hidden></span>
      </div>
      <div class="lang-group">
        <label id="langLabel" for="langSelect"></label>
        <select id="langSelect"></select>
      </div>
    </header>

    <!-- Corner grid: front arrow, cross dividers, four quadrants -->
    <main class="corner-area">
      <div class="front-arrow" aria-hidden="true">
        <svg viewBox="0 0 204 32" width="204" height="32">
          <polyline points="2,30 102,2 202,30" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
      </div>
      <div class="divider-v" aria-hidden="true"></div>
      <div class="divider-h" aria-hidden="true"></div>
      <div id="cornerGrid" class="corner-grid">
        <!-- corner cards are generated by app.js -->
      </div>
    </main>

    <!-- Bottom bar: reset (always) + temp-adjust slider (manual mode only) -->
    <footer class="bottombar">
      <button id="resetBtn" class="btn" type="button"></button>
      <div id="adjustGroup" class="adjust-group">
        <span id="adjustLabel" class="adjust-label"></span>
        <input id="adjustSlider" type="range" min="-15" max="15" step="0.5" value="0" />
      </div>
    </footer>

    <!-- Prediction inputs panel (prediction mode only) -->
    <section id="predPanel" class="pred-panel" hidden>
      <div class="pred-field">
        <label id="trackLabel" for="trackSelect"></label>
        <select id="trackSelect"></select>
      </div>
      <div class="pred-field">
        <label id="carLabel" for="carSelect"></label>
        <select id="carSelect"></select>
      </div>
      <div class="pred-field">
        <label id="compoundLabel" for="compoundSelect"></label>
        <select id="compoundSelect"></select>
      </div>
      <div class="pred-field">
        <label id="conditionLabel" for="conditionSelect"></label>
        <select id="conditionSelect"></select>
      </div>
      <div class="pred-field">
        <label id="lapLabel" for="lapInput"></label>
        <input id="lapInput" type="number" min="1" max="60" step="1" inputmode="numeric" />
      </div>
      <div class="pred-field">
        <label id="ambientLabel" for="ambientInput"></label>
        <input id="ambientInput" type="number" min="-20" max="50" step="0.5" inputmode="decimal" />
      </div>
      <div class="pred-field">
        <label id="cloudLabel" for="cloudInput"></label>
        <input id="cloudInput" type="number" min="0" max="100" step="10" inputmode="numeric" />
      </div>
      <div class="pred-field">
        <label id="targetLapLabel" for="targetLapInput"></label>
        <input id="targetLapInput" type="text" inputmode="decimal" autocomplete="off" placeholder="1:05.2" />
      </div>
    </section>
  </div>

  <noscript><p style="padding:16px">This calculator requires JavaScript.</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
