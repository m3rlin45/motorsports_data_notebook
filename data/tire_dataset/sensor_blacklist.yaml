# Per-(session_id, corner) TPMS channels to exclude from tire-model training.
#
# Run `just tire-sensor-audit` to surface candidates. Each entry is a
# (session, corner) pair where the TPMS channel was stuck/broken so the
# warmup-curve fit shouldn't see it. Only the listed corner is masked —
# the rest of the session's corners still contribute to training.
#
# Format:
#   entries:
#     - session_id: <full-session-id>
#       corner: fl | fr | rl | rr
#       reason: "<short human-readable explanation>"

entries:
  - session_id: 01811fbc44ee4dcb
    corner: rl
    reason: "Stuck at 28.0 °C across 9 laps (Inferno 86, Fuji 2025-07-07)"

  # KK-SII RR sensor failure: same bad sensor across 4 sessions on Fuji 2026-02-26
  - session_id: 034b6b78a440fe3a
    corner: rr
    reason: "Stuck at 13.0 °C across 13 laps (KK-SII, Fuji 2026-02-26)"
  - session_id: 1efdf17c42265ba9
    corner: rr
    reason: "Stuck at 13.0 °C across 4 laps (KK-SII, Fuji 2026-02-26)"
  - session_id: bbe7b51bd428f5a0
    corner: rr
    reason: "Stuck at 13.0 °C across 13 laps (KK-SII, Fuji 2026-02-26)"
  - session_id: d3bf612415fb31ba
    corner: rr
    reason: "Stuck at 14.0 °C across 13 laps (KK-SII, Fuji 2026-02-26)"

  # KK-SII RR also stuck the day before
  - session_id: 1cd906c9ecf27b24
    corner: rr
    reason: "Stuck at 12.0 °C across 11 laps (KK-SII, Fuji 2026-02-25)"

