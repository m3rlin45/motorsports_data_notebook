# Per-(session_id, corner) TPMS channels to exclude from tire-model training.
#
# Run `just tire-sensor-audit` to surface candidates. Each entry is a
# (session, corner) pair where the TPMS channel was stuck/broken so the
# warmup-curve fit shouldn't see it. Only the listed corner is masked —
# the rest of the session's corners still contribute to training.
#
# Format:
#   entries:
#     - session_id: <full-session-id>
#       corner: fl | fr | rl | rr
#       reason: "<short human-readable explanation>"
#
# History: the original 8 entries (documented in docs/tire_model.md §2.8)
# referenced session IDs from before the AIM-split session merge and had
# been silently masking nothing. After the wall-clock-aware re-extraction
# (extractor 0.8.0, 2026-08-16) every one of those stuck channels is
# non-finite in its session — a channel that is flat from the first sample
# gets fully masked by the session-level stale-prefix logic — so no manual
# entries are currently required. Audit candidates that remain are genuine
# slow-warmup or pre-warmed short stints, reviewed and left unmasked.

entries: []
