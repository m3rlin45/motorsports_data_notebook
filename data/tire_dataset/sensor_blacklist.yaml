# Per-(session_id, corner) TPMS channels to exclude from tire-model training.
#
# Run `just tire-sensor-audit` to surface candidates. Each entry is a
# (session, corner) pair where the TPMS channel was stuck/broken so the
# warmup-curve fit shouldn't see it. Only the listed corner is masked —
# the rest of the session's corners still contribute to training.
#
# Format:
#   entries:
#     - session_id: <full-session-id>
#       corner: fl | fr | rl | rr
#       reason: "<short human-readable explanation>"
#
# History: the original 8 entries (documented in docs/tire_model.md §2.8)
# referenced pre-merge session IDs that no longer exist after the AIM-split
# session merge (tire-etl, 2026-06). Re-audit of the merged dataset
# (2026-08-16) found the stuck-channel data from 7 of them is now non-finite
# in the merged sessions (zero finite usable laps on those corners), so it is
# excluded from training automatically. The one channel whose stuck values
# survived the merge is listed below under its current session ID.

entries:
  # KK-SII RR sensor failure cluster, Fuji 2026-02-25/26 (see docs §2.8).
  # Sole surviving finite stuck channel after the AIM-split session merge.
  - session_id: d5db9e681a1ca2b9
    corner: rr
    reason: "Stuck at 14.0 °C across 14 laps (KK-SII, Fuji 2026-02-26)"
