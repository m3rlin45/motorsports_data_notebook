# Tire compound history for model training — human-curated.
#
# Per-session, per-axle labels for the Inferno 86 (compounds change
# between and even within track days). front/rear: A052, RE-71RS,
# A050, NS-2R, ... or null when unknown. Null sessions train on the
# pooled per-car K exactly as before. Sessions marked [no TPMS] have
# no usable tire telemetry and are listed for the historical record
# only.
#
# Provenance: [note] = stated in that day's run notes; [inferred] =
# cross-note wheel-set reasoning: the black-wheel set carried the
# RE-71RS (stated 2025-12-14, bought new early May 2025), the silver
# set was the worn A052s from April 2025, and a fresh A052 set
# arrived 2025-06-09 ("A052 Sticker"). Review [inferred] rows
# before trusting them.

# Wheel-set -> compound mapping: resolves "SET:<name>" labels coming from
# the notes extraction (e.g. "Black wheels"). Valid for the 2025 sets; if a
# set is re-shod with a different tire, date-scope the sidecar entries
# instead of relying on this map. "silver-blue" (first seen 2026-02-07) is
# deliberately unmapped until its tire is known.
wheel_sets:
  black: RE-71RS
  silver: A052

