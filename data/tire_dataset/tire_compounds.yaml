# Tire compound exceptions for model training — human-curated.
#
# Per-session compound labels normally come from the per-day parse of the
# run notes and of each logger file's RaceStudio "Long Comment"
# (tire_etl.session_notes -> notes_matches.parquet): the driver writes the
# tire fitted there ("re-71rs", "A052 used", "qually, slick tires"). This
# file holds only what that parse cannot supply. Rows here override it.
# Sessions with no label are assigned by the compound EM jointly with the
# pressure regression, which cannot tell A052 from RE-71RS (their heat
# multipliers differ by ~3 %), so a documented tire always beats inference.
#
# One compound per session — every run has ONE tire on all four corners
# (team rule; there is no mixed-axle setup). compound: A052, RE-71RS,
# A050, NS-2R, DRY / WET (the formula cars' slick / rain tires), ...

# Wheel-set -> compound mapping: resolves "SET:<name>" labels coming from
# the notes ("Black wheels"). Only note-explicit mappings ("RE-71RS 40%
# Black wheels", 2025-12-14); "silver" and "silver-blue" are unmapped until
# their tire is known. If a set is re-shod with a different tire, add a
# date-scoped session row below instead of relying on this map.
wheel_sets:
  black: RE-71RS

# Weather-driven tire choices: cars whose compound follows the conditions.
# An all-dry session seeds as the dry tire, an all-wet session as the wet
# tire; damp/mixed sessions are left to the notes / comments / inference.
# The KK-SII's sessions carry no notes or comments naming the tire, so
# these seeds are the FJ's only WET anchors. The KK-F is deliberately not
# seeded: on 2026-10-25 it qualified on slicks on a track the wetness model
# calls wet, and its comments name the tire anyway.
condition_seeds:
  KK-SII:
    dry: DRY
    wet: WET

sessions:
  - session_id: c324e3840d9ac354  # 2025-10-26 14:37 tsukuba_2000 Inferno 86 (54 laps)
    # No file comment and no 2025-10-26 notes; the day before at the same
    # track the comments say "Tires a052 used" and the 2025-10-25 notes say
    # "Tires A052". Left to inference the EM calls this RE-71RS (0.82).
    compound: A052
