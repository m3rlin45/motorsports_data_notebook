name: Build Desktop App

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: desktop_app
        run: uv sync --extra build

      - name: Build executable
        working-directory: desktop_app
        run: uv run pyinstaller --clean --noconfirm inferno_analyzer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfernoAnalyzer-Windows
          path: desktop_app/dist/InfernoAnalyzer.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: desktop_app
        run: uv sync --extra build

      - name: Build executable
        working-directory: desktop_app
        run: uv run pyinstaller --clean --noconfirm inferno_analyzer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfernoAnalyzer-Linux
          path: desktop_app/dist/InfernoAnalyzer
          retention-days: 30

  attach-to-release:
    needs: [build-windows, build-linux]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: InfernoAnalyzer-Windows
          path: dist/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: InfernoAnalyzer-Linux
          path: dist/

      - name: Rename Linux binary
        run: mv dist/InfernoAnalyzer dist/InfernoAnalyzer-Linux

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/InfernoAnalyzer.exe
            dist/InfernoAnalyzer-Linux
