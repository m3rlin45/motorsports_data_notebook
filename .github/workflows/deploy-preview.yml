name: Deploy Preview to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Allow only one concurrent deployment per branch
concurrency:
  group: pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-lite.yml

  build-tire-pressure:
    uses: ./.github/workflows/build-tire-pressure-web.yml

  deploy:
    needs: [build, build-tire-pressure]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download JupyterLite site
        uses: actions/download-artifact@v4
        with:
          name: jupyterlite-site
          path: dist/

      - name: Download tire pressure calculator web build
        uses: actions/download-artifact@v4
        with:
          name: tire-pressure-web
          path: dist/tire-pressure/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
