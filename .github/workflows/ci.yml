name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        # tire-etl + tire-model extras carry runtime deps (pydantic, duckdb,
        # scipy) that mypy needs to resolve imports in src/.
        run: uv sync --extra app --extra tire-etl --extra tire-model

      - name: Run checks
        run: just check

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 7
