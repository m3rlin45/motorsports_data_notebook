name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'desktop_app_rs/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'desktop_app_rs/**'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: uv sync --extra app

      - name: Run checks
        run: just check

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 7
