name: Build Tire Pressure Calculator (Web)

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run web calculator tests
        run: node --test 'tire_pressure_calculator/web/tests/*.test.mjs'

      - name: Assemble static site
        run: |
          mkdir -p site
          cp -r tire_pressure_calculator/web/. site/
          rm -rf site/tests
          cp data/tire_dataset/tire_model.json site/
          # Stamp the service-worker cache version so each deploy busts the
          # previous one, and the app version shown in the footer (the repo
          # copies keep the __BUILD__ / __VERSION__ placeholders).
          VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -1)
          test -n "$VERSION"
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" site/sw.js
          sed -i "s/__VERSION__/${VERSION}/" site/js/app.js

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: tire-pressure-web
          path: site/
          if-no-files-found: error
          retention-days: 7
