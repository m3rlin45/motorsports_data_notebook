name: Build Tire Pressure Calculator

on:
  push:
    branches: [master]
    paths:
      - 'tire_pressure_calculator/**'
      - '.github/workflows/build-tire-pressure.yml'
  pull_request:
    branches: [master]
    paths:
      - 'tire_pressure_calculator/**'
      - '.github/workflows/build-tire-pressure.yml'
  release:
    types: [published]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check formatting
        working-directory: tire_pressure_calculator
        run: dotnet format TirePressureCalculator.slnx --verify-no-changes

      - name: Run tests
        working-directory: tire_pressure_calculator
        run: dotnet test Tests/TirePressureCalculator.Tests.csproj --verbosity normal

  build-windows:
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        working-directory: tire_pressure_calculator
        run: >
          dotnet publish Desktop/TirePressureCalculator.Desktop.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishAot=false -p:PublishTrimmed=true -p:TrimMode=full
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TirePressureCalculator-Windows
          path: tire_pressure_calculator/Desktop/bin/Release/net10.0/win-x64/publish/TirePressureCalculator.Desktop.exe
          retention-days: 30

  build-linux:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AOT dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        working-directory: tire_pressure_calculator
        run: dotnet publish Desktop/TirePressureCalculator.Desktop.csproj -c Release -r linux-x64 --self-contained

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TirePressureCalculator-Linux
          path: tire_pressure_calculator/Desktop/bin/Release/net10.0/linux-x64/publish/TirePressureCalculator.Desktop
          retention-days: 30

  build-android:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Publish
        working-directory: tire_pressure_calculator
        run: dotnet publish Android/TirePressureCalculator.Android.csproj -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TirePressureCalculator-Android
          path: tire_pressure_calculator/Android/bin/Release/net10.0-android/publish/com.inferno.tirepressurecalculator-Signed.apk
          retention-days: 30

  attach-to-release:
    needs: [build-windows, build-linux, build-android]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: TirePressureCalculator-Windows
          path: dist/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: TirePressureCalculator-Linux
          path: dist/

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: TirePressureCalculator-Android
          path: dist/

      - name: Rename binaries
        run: |
          mv dist/TirePressureCalculator.Desktop.exe dist/TirePressureCalculator.exe
          mv dist/TirePressureCalculator.Desktop dist/TirePressureCalculator-Linux
          mv dist/com.inferno.tirepressurecalculator-Signed.apk dist/TirePressureCalculator.apk

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TirePressureCalculator.exe
            dist/TirePressureCalculator-Linux
            dist/TirePressureCalculator.apk
