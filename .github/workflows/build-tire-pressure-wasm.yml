name: Build Tire Pressure Calculator (WASM)

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish Browser app
        working-directory: tire_pressure_calculator
        run: dotnet publish Browser/TirePressureCalculator.Browser.csproj -c Release

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: tire-pressure-wasm
          path: tire_pressure_calculator/Browser/bin/Release/net10.0-browser/browser-wasm/AppBundle/
          if-no-files-found: error
          retention-days: 7
