name: Build and Deploy Release

on:
  release:
    types: [published]

concurrency:
  group: pages-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.1.1

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - run: poetry install --extras jupyterlite

      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: ${{ runner.os }}-emsdk-3.1.58

      - run: poetry run poe setup_emsdk
      - run: poetry run poe build_lite_full

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RELEASE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Install Git LFS
        run: |
          git lfs install

      - name: Push to releases repo
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no
        run: |
          # Clone releases repo (has .gitattributes with LFS config)
          git clone --depth 1 git@github.com:m3rlin45/motorsports-data-notebook-releases.git releases
          cd releases

          # Remove old content (except git files and .github)
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.gitattributes' ! -name '.github' -exec rm -rf {} +

          # Copy new content
          cp -r ../dist/* .

          # Add CNAME for custom domain
          echo "analysis.inferno.racing" > CNAME

          # Commit and push with LFS
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Release ${{ github.event.release.tag_name }}"
          git push origin main
