name: Build & Publish MCP Server

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build wheel (bundles motorsports_data_notebook)
        working-directory: inferno-driving-coach
        run: |
          cp -r ../src/motorsports_data_notebook src/
          # --wheel only: dynamic version (via tool.setuptools.dynamic) reads the
          # root pyproject.toml at build time, which isn't available inside the
          # sdist-then-wheel temp dir. Direct wheel build sees the real source tree.
          uv build --wheel --out-dir dist
          rm -rf src/motorsports_data_notebook

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inferno-driving-coach-dist
          path: inferno-driving-coach/dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: inferno-driving-coach-dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish dist/*

  attach-to-release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: inferno-driving-coach-dist
          path: dist/

      - name: Attach wheel to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
