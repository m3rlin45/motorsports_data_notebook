name: Build JupyterLite Site

on:
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact"
        value: "jupyterlite-site"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-lite-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: Install dependencies
        run: uv sync --extra app --extra jupyterlite

      - name: Build wheels and JupyterLite site
        run: just build-lite-full

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jupyterlite-site
          path: dist/
