name: Build JupyterLite Site

on:
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact"
        value: "jupyterlite-site"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install Rust nightly with wasm32-unknown-emscripten
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-emscripten
          components: rust-src

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-lite-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: Install dependencies
        run: uv sync --extra app --extra jupyterlite

      - name: Verify pyodide-build version
        run: |
          EXPECTED="0.29.3"
          ACTUAL=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('pyodide-build'))")
          echo "pyodide-build version: $ACTUAL (expected: $EXPECTED)"
          [ "$ACTUAL" = "$EXPECTED" ] || (echo "ERROR: Wrong pyodide-build version!" && exit 1)

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            emsdk-${{ runner.os }}-

      - name: Setup Emscripten SDK
        run: just setup-emsdk

      - name: Build wheels and JupyterLite site
        run: just build-lite-full

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jupyterlite-site
          path: dist/
