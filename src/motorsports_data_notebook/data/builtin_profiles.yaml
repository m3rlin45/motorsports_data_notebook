# Vehicle profiles for AIM telemetry channel mapping.
#
# To add your vehicle, submit a PR with:
# 1. A new entry under "profiles" with your vehicle's channel names and shock
#    calibration (or motion ratios)
# 2. Your logger serial number under "logger_map" pointing to your profile
#
# Channel names must match exactly what appears in Race Studio 3 / AIM logger config.
#
# Motion ratio convention: the suspension analysis works from the logged shock
# pot (stroke sensor) channel, so every profile's motion ratio is
# POT travel / WHEEL travel (wheel_velocity = pot_velocity / ratio). Each
# profile stores a `shock_calibration` block with the measured slopes per axle:
#   wheel_per_sensor  - mm of wheel travel per mm of pot travel (pot/wheel = 1/this)
#   damper_per_sensor - mm of damper travel per mm of pot travel (1.0 when the
#                       pot is mounted on the damper)
#   damper_per_wheel  - mm of damper travel per mm of wheel travel, fitted
#                       directly (not a ratio of the two slopes above); for
#                       spring/damper-rate modeling, not used by the analysis
# and `motion_ratios` are derived from it (pot/wheel). An explicit
# `motion_ratios` entry overrides the derived value (e.g. asymmetric L/R).
# Fit a measured table with scripts/fit_shock_calibration.py.
#
# `track_width_mm` (front/rear, hub centre to hub centre) is used by the roll
# gradient analysis: roll = atan((wheel_left - wheel_right) / track).

profiles:
  toyota_86_zn6:
    name: Toyota 86 ZN6
    # AiM Solo2 DL / MXP 1.3 + Toyota GT86 CAN expansion
    channel_names:
      throttle: PPS
      brake: BrakePress
      gps_speed: GPS Speed
      gps_latitude: GPS Latitude
      gps_longitude: GPS Longitude
      lateral_g: LateralAcc
      steering: SteerAngle
      shock_fl: LF_Shock_Pot
      shock_fr: RF_Shock_Pot
      shock_rl: LR_Shock_Pot
      shock_rr: RR_Shock_Pot
      tpms_press_fl: TPMS_Press_LF
      tpms_press_fr: TPMS_Press_RF
      tpms_press_rl: TPMS_Press_LR
      tpms_press_rr: TPMS_Press_RR
      tpms_temp_fl: TPMS_Temp_LF
      tpms_temp_fr: TPMS_Temp_RF
      tpms_temp_rl: TPMS_Temp_LR
      tpms_temp_rr: TPMS_Temp_RR
      tire_temp_fl_1: FL_Ch1
      tire_temp_fl_2: FL_Ch2
      tire_temp_fl_3: FL_Ch3
      tire_temp_fl_4: FL_Ch4
      tire_temp_fl_5: FL_Ch5
      tire_temp_fl_6: FL_Ch6
      tire_temp_fl_7: FL_Ch7
      tire_temp_fl_8: FL_Ch8
      tire_temp_fr_1: FR_Ch1
      tire_temp_fr_2: FR_Ch2
      tire_temp_fr_3: FR_Ch3
      tire_temp_fr_4: FR_Ch4
      tire_temp_fr_5: FR_Ch5
      tire_temp_fr_6: FR_Ch6
      tire_temp_fr_7: FR_Ch7
      tire_temp_fr_8: FR_Ch8
      tire_temp_rl_1: RL_Ch1
      tire_temp_rl_2: RL_Ch2
      tire_temp_rl_3: RL_Ch3
      tire_temp_rl_4: RL_Ch4
      tire_temp_rl_5: RL_Ch5
      tire_temp_rl_6: RL_Ch6
      tire_temp_rl_7: RL_Ch7
      tire_temp_rl_8: RL_Ch8
      tire_temp_rr_1: RR_Ch1
      tire_temp_rr_2: RR_Ch2
      tire_temp_rr_3: RR_Ch3
      tire_temp_rr_4: RR_Ch4
      tire_temp_rr_5: RR_Ch5
      tire_temp_rr_6: RR_Ch6
      tire_temp_rr_7: RR_Ch7
      tire_temp_rr_8: RR_Ch8
    # Shock pots mounted on the dampers, so pot/wheel equals the damper/wheel
    # geometry ratio: 0.997 front (MacPherson strut), 0.768 rear (multi-link).
    # damper_per_sensor is 1.0 by construction (pot on the damper body).
    shock_calibration:
      front:
        wheel_per_sensor: 1.003009   # 1 / 0.997
        damper_per_sensor: 1.0
        damper_per_wheel: 0.997
      rear:
        wheel_per_sensor: 1.302083   # 1 / 0.768
        damper_per_sensor: 1.0
        damper_per_wheel: 0.768
    track_width_mm:
      front: 1520   # ZN6 factory spec
      rear: 1540

  honda_ek9:
    name: Honda Civic EK9
    # AiM Solo logger — GPS-only, no CAN bus, no shock pots
    channel_names:
      gps_speed: GPS Speed
      gps_latitude: GPS Latitude
      gps_longitude: GPS Longitude
      lateral_g: LateralAcc
    motion_ratios:
      front_left: 1.0
      front_right: 1.0
      rear_left: 1.0
      rear_right: 1.0

  super_fj:
    name: Super FJ
    # AiM MXm logger
    channel_names:
      throttle: ACCEL
      brake: BRK
      gps_speed: GPS Speed
      gps_latitude: GPS Latitude
      gps_longitude: GPS Longitude
      lateral_g: LateralAcc
      steering: steering
    motion_ratios:
      front_left: 1.0
      front_right: 1.0
      rear_left: 1.0
      rear_right: 1.0

  kk_s2:
    name: KK-SII
    # AiM SW4 logger + Trailbrake TPMS (+ 100 mm stroke sensors since 2026)
    # Note: separate front/rear brake channels; brake maps to front brake
    channel_names:
      throttle: Throttle
      brake: F_BRK
      brake_rear: R_BRK
      gps_speed: GPS Speed
      gps_latitude: GPS Latitude
      gps_longitude: GPS Longitude
      lateral_g: GPS_LateralAcc
      inline_g: GPS_InlineAcc
      steering: Steering
      shock_fl: LF_Shock_Pot
      shock_fr: RF_Shock_Pot
      shock_rl: LR_Shock_Pot
      shock_rr: RR_Shock_Pot
      tpms_press_fl: TPMS_Press_LF
      tpms_press_fr: TPMS_Press_RF
      tpms_press_rl: TPMS_Press_LR
      tpms_press_rr: TPMS_Press_RR
      tpms_temp_fl: TPMS_Temp_LF
      tpms_temp_fr: TPMS_Temp_RF
      tpms_temp_rl: TPMS_Temp_LR
      tpms_temp_rr: TPMS_Temp_RR
    # Not calibrated yet: pot/wheel assumed 1:1 until the stroke sensors are
    # measured like the KK-F's (expect similar values to kk_f).
    shock_calibration:
      front:
        wheel_per_sensor: 1.0
        damper_per_sensor: 1.0
        damper_per_wheel: 1.0
      rear:
        wheel_per_sensor: 1.0
        damper_per_sensor: 1.0
        damper_per_wheel: 1.0
    # MYST KK-S published figures (front 1498 / rear 1503 mm); verify on the car
    track_width_mm:
      front: 1498
      rear: 1503

  kk_f:
    name: KK-F
    # Shares SW4 logger 8401203 with the KK-SII but runs its own config with the
    # MYST ECU stream (channel set taken from the 2026-09-27 Tsukuba race file):
    # throttle/brake come from the ECU (Throttle_PCT %, P_Brake_Actual bar; the
    # ECU's Pbrake_Value is sign-inverted and not mapped), no separate rear brake
    # pressure, and the SW4 "steering" channel is uncalibrated (0-0.5 deg).
    # 100 mm stroke sensors on all corners.
    channel_names:
      throttle: Throttle_PCT
      brake: P_Brake_Actual
      gps_speed: GPS Speed
      gps_latitude: GPS Latitude
      gps_longitude: GPS Longitude
      lateral_g: GPS_LateralAcc
      inline_g: GPS_InlineAcc
      steering: steering
      shock_fl: LF_Shock_Pot
      shock_fr: RF_Shock_Pot
      shock_rl: LR_Shock_Pot
      shock_rr: RR_Shock_Pot
      tpms_press_fl: TPMS_Press_LF
      tpms_press_fr: TPMS_Press_RF
      tpms_press_rl: TPMS_Press_LR
      tpms_press_rr: TPMS_Press_RR
      tpms_temp_fl: TPMS_Temp_LF
      tpms_temp_fr: TPMS_Temp_RF
      tpms_temp_rl: TPMS_Temp_LR
      tpms_temp_rr: TPMS_Temp_RR
    # Stroke-sensor calibration, measured 2026-10 with spring and ARB removed,
    # one corner per axle (left/right assumed symmetric). Linear least-squares
    # slopes fitted with scripts/fit_shock_calibration.py; `points` are the raw
    # rows [wheel position, damper length, stroke sensor reading] in mm with any
    # fixed zero reference. The sensor is not parallel to the damper, so the
    # damper/wheel geometry ratio differs from pot/wheel; `damper_per_wheel`
    # is fitted directly from the damper-vs-wheel points (0.908 front /
    # 0.771 rear), not taken as a ratio of the two sensor slopes.
    #
    # The suspension analysis uses pot -> wheel only: `motion_ratios` derive as
    # pot/wheel = 1 / wheel_per_sensor (0.875 front, 0.742 rear) and divide the
    # logged channel (wheel_velocity = pot_velocity / ratio). Pots are zeroed on
    # the car; with linear slopes the zero offset has no effect.
    shock_calibration:
      front:
        wheel_per_sensor: 1.1433
        damper_per_sensor: 1.0406
        damper_per_wheel: 0.9082
        wheel_r2: 0.9961
        damper_r2: 0.9985
        damper_wheel_r2: 0.9979
        points:
          - [401.4, 300.0, 10.2]
          - [407.6, 295.0, 15.1]
          - [414.3, 290.0, 19.0]
          - [420.0, 285.0, 24.2]
          - [425.4, 280.0, 30.1]
          - [429.7, 275.0, 34.6]
          - [436.0, 270.0, 38.4]
          - [440.3, 265.0, 42.7]
          - [446.9, 260.0, 48.6]
          - [451.3, 255.0, 53.7]
      rear:
        wheel_per_sensor: 1.3484
        damper_per_sensor: 1.0407
        damper_per_wheel: 0.7713
        wheel_r2: 0.9987
        damper_r2: 0.9986
        damper_wheel_r2: 0.9987
        points:
          - [385.9, 301.2, 8.2]
          - [394.0, 299.0, 10.4]    # excluded: sensor reading inconsistent
          - [401.5, 288.5, 10.8]    # excluded: sensor reading inconsistent
          - [412.9, 280.0, 28.9]
          - [418.7, 276.0, 33.5]
          - [427.6, 269.1, 40.3]
          - [437.5, 262.2, 45.9]
          - [439.1, 261.1, 47.8]
          - [440.1, 259.2, 48.7]
          - [452.2, 249.2, 57.9]
        excluded_points: [1, 2]
    # ASSUMED equal to the KK-S (1498 / 1503 mm) until measured. JAF FJ1500
    # rules only bound it (tread >= 1200 mm, overall width <= 1700 mm).
    track_width_mm:
      front: 1498
      rear: 1503

  iracing:
    name: iRacing
    # iRacing telemetry — all cars use the same channel names
    # Throttle/Brake are 0-1 (not 0-100%), Speed is m/s, shock channels are velocity (m/s)
    channel_names:
      throttle: Throttle
      brake: Brake
      gps_speed: Speed
      gps_latitude: Lat
      gps_longitude: Lon
      lateral_g: LatAccel
      inline_g: LongAccel
      steering: SteeringWheelAngle
      shock_fl: LFshockVel
      shock_fr: RFshockVel
      shock_rl: LRshockVel
      shock_rr: RRshockVel
      tpms_press_fl: LFpressure
      tpms_press_fr: RFpressure
      tpms_press_rl: LRpressure
      tpms_press_rr: RRpressure
      tpms_temp_fl: LFtempM
      tpms_temp_fr: RFtempM
      tpms_temp_rl: LRtempM
      tpms_temp_rr: RRtempM
      tire_temp_fl_1: LFtempL
      tire_temp_fl_2: LFtempM
      tire_temp_fl_3: LFtempR
      tire_temp_fr_1: RFtempL
      tire_temp_fr_2: RFtempM
      tire_temp_fr_3: RFtempR
      tire_temp_rl_1: LRtempL
      tire_temp_rl_2: LRtempM
      tire_temp_rl_3: LRtempR
      tire_temp_rr_1: RRtempL
      tire_temp_rr_2: RRtempM
      tire_temp_rr_3: RRtempR
    motion_ratios:
      front_left: 1.0
      front_right: 1.0
      rear_left: 1.0
      rear_right: 1.0

# Logger ID -> profile name mappings.
#
# A logger shared between cars (same serial, different Race Studio config) can
# map per vehicle: `default` is used when the vehicle is unknown, `by_vehicle`
# matches the Race Studio vehicle name (file metadata "Vehicle" in .xrk files,
# or the second "_" token of the file name, e.g. CMD_KK-F_Suzuka West_..., for
# .xrz exports that lack it). Matching is case-insensitive.
logger_map:
  6519522: toyota_86_zn6    # Inferno 86 — Solo2 DL (no shock pots or TPMS)
  6701209: toyota_86_zn6    # Inferno 86 — MXP 1.3 (with shock pots + TPMS from Aug 2025)
  15074: honda_ek9           # EK9 — Solo logger
  6603435: super_fj              # Super FJ — MXm logger
  8401203:                   # SW4 steering-wheel logger shared by the KK-SII and KK-F
    default: kk_s2
    by_vehicle:
      KK-SII: kk_s2
      KK-F: kk_f
  iracing: iracing            # iRacing — all cars use the same channel names
