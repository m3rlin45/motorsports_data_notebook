[project]
name = "driver-consistency-analyzer"
version = "0.1.0"
description = "Standalone desktop app for driver consistency analysis (throttle acceptance & braking points)"
authors = [
    {name = "Christopher Dewan", email = "chris.dewan@m3rlin.net"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "customtkinter>=5.2.0",
    "tkinterdnd2>=0.4.2",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    "pyarrow>=15.0.0",
    "libxrk>=0.8.0",
    "motorsports-data-notebook",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]
dev = [
    "black>=24.0.0",
    "mypy>=1.8.0",
    "poethepoet>=0.24.0",
]

[tool.poetry]
packages = [{include = "driver_consistency_analyzer", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
motorsports-data-notebook = {path = "..", develop = true}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "libxrk.*",
    "numpy.*",
    "pyarrow.*",
    "pandas",
    "pandas.*",
    "customtkinter.*",
    "tkinterdnd2.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.poe.tasks]
run = { cmd = "python -m driver_consistency_analyzer", help = "Run the desktop app" }
build = { shell = "pyinstaller driver_consistency_analyzer.spec", help = "Build standalone exe" }
lint = { cmd = "black --check src/", help = "Check code formatting" }
format = { cmd = "black src/", help = "Format code" }
typecheck = { cmd = "mypy src/", help = "Run type checking" }
check = { shell = "poe lint && poe typecheck", help = "Run all checks" }
