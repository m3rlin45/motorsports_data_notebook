[project]
name = "motorsports-data-notebook"
version = "0.3.0"
description = ""
authors = [
    {name = "Christopher Dewan",email = "chris.dewan@m3rlin.net"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "jupyterlab (>=4.4.10,<5.0.0)",
    "notebook (>=7.4.7,<8.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.4,<3.0.0)",
    "pyarrow (>=22.0.0,<23.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "plotly (>=6.4.0,<7.0.0)",
    "poethepoet (>=0.24.0,<1.0.0)",
    "libxrk>=0.3.0"
]

[project.optional-dependencies]
jupyterlite = [
    "jupyterlite-core==0.6.0",
    "jupyterlite-pyodide-kernel==0.6.0",
    "pyodide-build==0.27.3"
]

[tool.poetry]
packages = [{include = "motorsports_data_notebook", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
clean = { shell = "rm -f workspace/*.* && cp workspace_template/starter_notebook.ipynb workspace/starter_notebook.ipynb && cp workspace_template/'CMD_Inferno 86_Fuji GP Sh_Generic testing_a_2248.xrz' workspace/'CMD_Inferno 86_Fuji GP Sh_Generic testing_a_2248.xrz'", help = "Clean workspace and copy fresh starter notebook" }
run = { cmd = "jupyter lab workspace/starter_notebook.ipynb", help = "Start Jupyter notebook" }
run_clean = ["clean", "run"]

# JupyterLite wheel building tasks
build_wheel = { shell = "poetry build -f wheel && python scripts/build_lite_wheel.py", help = "Build motorsports_data_notebook wheel (no deps for JupyterLite)" }
_download_libxrk = { shell = "rm -rf build/libxrk && mkdir -p build/libxrk && pip download --no-deps --no-binary libxrk -d build/libxrk libxrk && cd build/libxrk && tar -xzf *.tar.gz --strip-components=1 && rm -f *.tar.gz", help = "Download and extract libxrk sdist from PyPI" }
_build_libxrk_pyodide = { shell = "cd build/libxrk && export PATH=\"$HOME/emsdk:$HOME/emsdk/upstream/emscripten:$HOME/emsdk/node/22.16.0_64bit/bin:$PATH\" && pyodide build . --skip-dependency-check", help = "Build libxrk for Pyodide" }
_copy_libxrk_wheel = { shell = "mkdir -p pypi && cp build/libxrk/dist/*.whl pypi/", help = "Copy libxrk wheel to pypi" }
build_libxrk_pyodide = { sequence = ["_download_libxrk", "_build_libxrk_pyodide", "_copy_libxrk_wheel"], help = "Build libxrk wheel for Pyodide (requires emsdk installed)" }
build_wheels_lite = ["build_wheel", "build_libxrk_pyodide"]

# JupyterLite site building tasks  
build_lite = { shell = "rm -rf .lite_contents dist && mkdir -p .lite_contents && cp workspace_template/* .lite_contents/ && VERSION=$(poetry version -s) && mv .lite_contents/starter_notebook.ipynb \".lite_contents/starter_notebook_v${VERSION}.ipynb\" && jupyter lite build --contents .lite_contents --output-dir dist && rm -rf .lite_contents", help = "Build JupyterLite static site with versioned notebook" }
build_lite_full = ["build_wheels_lite", "build_lite"]
serve_lite = { cmd = "jupyter lite serve --output-dir dist", help = "Serve JupyterLite site locally" }
build_and_serve_lite = ["build_lite_full", "serve_lite"]

# Cleanup tasks
clean_build = { shell = "rm -rf build/ pypi/ dist/", help = "Clean all build artifacts" }
