[project]
name = "motorsports-data-notebook"
version = "0.6.0"
description = ""
authors = [
    {name = "Christopher Dewan",email = "chris.dewan@m3rlin.net"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "jupyterlab (>=4.4.10,<5.0.0)",
    "notebook (>=7.4.7,<8.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.4,<3.0.0)",
    "pyarrow (>=22.0.0,<23.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "plotly (>=6.4.0,<7.0.0)",
    "poethepoet (>=0.24.0,<1.0.0)",
    "libxrk>=0.4.0",
    "ipywidgets (>=8.0.0,<9.0.0)"
]

[project.optional-dependencies]
dev = [
    "black>=25.11.0",
    "mypy>=1.18.0",
    "nbqa>=1.9.0",
    "pandas-stubs>=2.0.0",
    "types-seaborn>=0.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
jupyterlite = [
    "jupyterlite-core==0.6.0",
    "jupyterlite-pyodide-kernel==0.6.0",
    "pyodide-build==0.27.3",
    "nbconvert>=7.0.0"
]

[tool.poetry]
packages = [{include = "motorsports_data_notebook", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '/(\.eggs|\.git|\.hg|\.mypy_cache|\.tox|\.venv|build|dist)/'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = ["^build/", "^dist/"]

[[tool.mypy.overrides]]
module = [
    "plotly.*",
    "matplotlib.*",
    "libxrk.*",
    "numpy.*",
    "ipywidgets.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.poe.tasks]
# Linting and type checking tasks
format = { cmd = "black src/", help = "Format source code with black" }
lint = { cmd = "black --check src/", help = "Check source code formatting with black" }
typecheck = { cmd = "mypy src/", help = "Type check source code with mypy" }
format-notebooks = { cmd = "nbqa black workspace_template/", help = "Format notebooks with black" }
lint-notebooks = { cmd = "nbqa black --check workspace_template/", help = "Check notebook formatting with black" }
typecheck-notebooks = { cmd = "nbqa mypy workspace_template/", help = "Type check notebooks with mypy" }
check = { sequence = ["lint", "typecheck", "lint-notebooks", "typecheck-notebooks", "test"], help = "Run all linting, type checking, and tests" }

# Testing tasks
test = { cmd = "pytest tests/ --cov=motorsports_data_notebook --cov-report=term-missing --cov-report=html:coverage_html", help = "Run tests with coverage" }

# Workspace tasks
clean = { shell = "rm -f workspace/*.* && cp workspace_template/basics.ipynb workspace/ && cp workspace_template/tire_analysis.ipynb workspace/ && cp workspace_template/track_analysis.ipynb workspace/ && cp workspace_template/consistency_analysis.ipynb workspace/ && cp workspace_template/suspension_analysis.ipynb workspace/ && cp workspace_template/'CMD_Inferno 86_Fuji GP Sh_Generic testing_a_2248.xrz' workspace/", help = "Clean workspace and copy fresh notebooks" }
run = { cmd = "jupyter lab workspace/", help = "Start Jupyter notebook" }
run_clean = ["clean", "run"]

# Emscripten SDK setup (one-time, needed for building libxrk Pyodide wheel)
setup_emsdk = { shell = "EMSDK_VERSION=$(pyodide config get emscripten_version) && ([ -d $HOME/emsdk ] || git clone https://github.com/emscripten-core/emsdk.git $HOME/emsdk) && cd $HOME/emsdk && git config core.autocrlf false && git checkout -- . && ./emsdk install $EMSDK_VERSION && ./emsdk activate $EMSDK_VERSION && pyodide xbuildenv install", help = "Install Emscripten SDK to ~/emsdk (one-time setup for Pyodide builds)" }

# JupyterLite wheel building tasks
build_wheel = { shell = "poetry build -f wheel && python scripts/build_lite_wheel.py", help = "Build motorsports_data_notebook wheel (no deps for JupyterLite)" }
_download_libxrk = { shell = "rm -rf build/libxrk && mkdir -p build/libxrk && pip download --no-deps --no-binary libxrk -d build/libxrk libxrk && cd build/libxrk && tar -xzf *.tar.gz --strip-components=1 && rm -f *.tar.gz", help = "Download and extract libxrk sdist from PyPI" }
_copy_libxrk_wheel = { shell = "mkdir -p pypi && cp build/libxrk/dist/*.whl pypi/", help = "Copy libxrk wheel to pypi" }
build_libxrk_pyodide = { sequence = ["_download_libxrk", "_build_libxrk_pyodide", "_copy_libxrk_wheel"], help = "Build libxrk wheel for Pyodide (requires setup_emsdk)" }
build_wheels_lite = ["build_wheel", "build_libxrk_pyodide"]

# JupyterLite site building tasks
_prepare_lite_contents = { shell = "rm -rf .lite_contents dist && mkdir -p .lite_contents && cp workspace_template/*.xrz .lite_contents/ && VERSION=$(poetry version -s) && for nb in basics tire_analysis track_analysis consistency_analysis suspension_analysis; do cp workspace_template/${nb}.ipynb \".lite_contents/${nb}_v${VERSION}.ipynb\"; done", help = "Prepare .lite_contents directory with versioned notebooks" }
_execute_lite_notebooks = { shell = "cd .lite_contents && python ../scripts/execute_notebooks.py", help = "Execute notebooks in .lite_contents to populate outputs" }
_build_lite_site = { shell = "jupyter lite build --contents .lite_contents --output-dir dist && rm -rf .lite_contents", help = "Build JupyterLite site from .lite_contents" }
build_lite = ["_prepare_lite_contents", "_execute_lite_notebooks", "_build_lite_site"]
build_lite_full = ["build_wheels_lite", "build_lite"]
serve_lite = { cmd = "jupyter lite serve --output-dir dist", help = "Serve JupyterLite site locally" }
build_and_serve_lite = ["build_lite_full", "serve_lite"]

# Cleanup tasks
clean_build = { shell = "rm -rf build/ pypi/ dist/", help = "Clean all build artifacts" }

[tool.poe.tasks._build_libxrk_pyodide]
shell = "cd build/libxrk && . $HOME/emsdk/emsdk_env.sh && pyodide build . --skip-dependency-check"
interpreter = "bash"
help = "Build libxrk for Pyodide"
