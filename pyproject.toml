[project]
name = "motorsports-data-notebook"
version = "0.15.0"
description = ""
authors = [
    {name = "Christopher Dewan",email = "chris.dewan@m3rlin.net"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=18.0.0,<23.0.0",
    "plotly>=6.0.0,<7.0.0",
    "libxrk>=0.12.0",
    "ipywidgets>=8.0.0,<9.0.0",
    "pyyaml>=6.0,<7.0",
    "libibt>=0.0.4",
]

[project.optional-dependencies]
app = [
    "jupyterlab>=4.4.10,<5.0.0",
    "notebook>=7.4.7,<8.0.0",
    "ipykernel>=7.1.0,<8.0.0",
    "matplotlib>=3.10.7,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
]
jupyterlite = [
    "jupyterlite-core==0.7.1",
    "jupyterlite-pyodide-kernel==0.7.0",
    "pyodide-build==0.29.3",
    "pyodide-lock==0.1.0a7",
    "wheel<0.44",
    "nbconvert>=7.0.0",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "mypy>=1.18.0",
    "nbqa>=1.9.0",
    "pandas-stubs>=2.0.0",
    "types-seaborn>=0.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motorsports_data_notebook = ["py.typed", "data/*.yaml"]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[tool.uv.workspace]
members = ["desktop_app", "inferno-driving-coach"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '/(\.eggs|\.git|\.hg|\.mypy_cache|\.tox|\.venv|build|dist)/'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = ["^build/", "^dist/"]

[[tool.mypy.overrides]]
module = [
    "plotly.*",
    "matplotlib.*",
    "libxrk.*",
    "numpy.*",
    "ipywidgets.*",
    "pyarrow.*",
    "customtkinter.*",
    "tkinterdnd2",
    "tkinterdnd2.*",
    "yaml.*",
]
ignore_missing_imports = true
