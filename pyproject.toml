[project]
name = "motorsports-data-notebook"
version = "0.1.0"
description = ""
authors = [
    {name = "Christopher Dewan",email = "chris.dewan@m3rlin.net"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "jupyterlab (>=4.4.10,<5.0.0)",
    "notebook (>=7.4.7,<8.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.4,<3.0.0)",
    "pyarrow (>=22.0.0,<23.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "plotly (>=6.4.0,<7.0.0)",
    "poethepoet (>=0.24.0,<1.0.0)",
    "libxrk @ git+https://github.com/m3rlin45/libxrk.git"
]

[project.optional-dependencies]
jupyterlite = [
    "jupyterlite-core==0.6.0",
    "jupyterlite-pyodide-kernel==0.6.0",
    "pyodide-build>=0.29.0"
]

[tool.poetry]
packages = [{include = "motorsports_data_notebook", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
clean = { shell = "rm -f workspace/*.* && cp workspace_template/starter_notebook.ipynb workspace/starter_notebook.ipynb && cp workspace_template/'CMD_Inferno 86_Fuji GP Sh_Generic testing_a_2248.xrk' workspace/'CMD_Inferno 86_Fuji GP Sh_Generic testing_a_2248.xrk'", help = "Clean workspace and copy fresh starter notebook" }
run = { cmd = "jupyter lab workspace/starter_notebook.ipynb", help = "Start Jupyter notebook" }
run_clean = ["clean", "run"]
build_wheel = { shell = "poetry build -f wheel && mkdir -p pypi && cp dist/motorsports_data_notebook*.whl pypi/", help = "Build motorsports_data_notebook wheel" }
build_libxrk_pyodide = { shell = "rm -rf /tmp/libxrk && git clone --depth 1 https://github.com/m3rlin45/libxrk.git /tmp/libxrk && cd /tmp/libxrk && export PATH=\"$HOME/emsdk:$HOME/emsdk/upstream/emscripten:$HOME/emsdk/node/22.16.0_64bit/bin:$PATH\" && pyodide build && mkdir -p $OLDPWD/pypi && cp dist/*.whl $OLDPWD/pypi/", help = "Build libxrk wheel for Pyodide (requires emsdk installed)" }
build_wheels_lite = ["build_wheel", "build_libxrk_pyodide"]
build_lite = { shell = "rm -rf dist && jupyter lite build --contents workspace_template --output-dir dist", help = "Build JupyterLite static site" }
build_lite_full = ["build_wheels_lite", "build_lite"]
serve_lite = { shell = "jupyter lite serve --output-dir dist", help = "Serve JupyterLite site locally" }
build_and_serve_lite = ["build_lite_full", "serve_lite"]
